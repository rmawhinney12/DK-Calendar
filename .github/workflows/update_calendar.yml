name: Update Combined Calendar

on:
  schedule:
    # Run every day at 6:00 AM Mountain Time during daylight saving time
    - cron: "0 12 * * *"

  # Allows manual runs from GitHub
  workflow_dispatch:

  # Run when the workflow itself changes
  push:
    branches:
      - main
      
permissions:
  contents: write

jobs:

  update-calendar:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Get repository files
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5


      # --------------------------------------------------
      # Set up Python
      # --------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # --------------------------------------------------
      # Install required Python packages
      # --------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4


      # --------------------------------------------------
      # Update Wasatch Vega calendar
      # --------------------------------------------------

      - name: Update Wasatch Vega calendar
        run: |
          python wasatch_vega_calendar.py


      # --------------------------------------------------
      # Update Deer Creek Vega calendar
      # --------------------------------------------------

      - name: Update Deer Creek Vega calendar
        run: |
          python deer_creek_vega_calendar.py


      # --------------------------------------------------
      # Update Heber Valley Railroad
      # --------------------------------------------------

      - name: Update Heber Valley Railroad calendar
        run: |
          python train_schedule.py


      # --------------------------------------------------
      # Update Soldier Hollow
      # --------------------------------------------------

      - name: Update Soldier Hollow calendar
        run: |
          python soldier_hollow_schedule.py


      # --------------------------------------------------
      # Combine all calendars
      # --------------------------------------------------

      - name: Create combined calendar
        run: |
          python combine_calendars.py


      # --------------------------------------------------
      # Save updated files to GitHub
      # --------------------------------------------------

      - name: Commit updated calendar
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add combined_calendar.ics
          git add combined_calendar.csv

          git add wasatch_vega_calendar.csv
          git add deer_creek_vega_calendar.csv
          git add heber_schedule.csv
          git add soldier_hollow_calendar.csv

          git diff --cached --quiet || git commit -m "Update combined calendar"

          git push
